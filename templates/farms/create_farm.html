{% extends "base.html" %}

<div class="col-lg-8">

<div class="card shadow">

<div class="card-body">

<h2 class="mb-4">

Create Your Farm

</h2>

{% if form.non_field_errors %}

<div class="alert alert-danger">

</div>

</div>

</div>
